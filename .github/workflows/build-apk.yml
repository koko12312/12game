name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0
    branches:
      - main # Builds and saves artifacts on every push to main
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write # Required to create releases and upload APK assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Web Directory & Capacitor
        run: |
          # Package the web files into a dist directory
          mkdir -p dist
          cp index.html dist/

          # Initialize Node project and install Capacitor CLI
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Initialize Capacitor with app credentials
          npx cap init "Neon Fusion" "com.neongame.fusiondrop" --web-dir "dist"

          # Add native Android platform files
          npx cap add android

          # Sync web assets into Android webview assets
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk NeonFusion-debug.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonFusion-debug-apk
          path: NeonFusion-debug.apk
          retention-days: 14

      - name: Publish Release with APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NeonFusion-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          
