<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Fusion Deluxe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #080a14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 10px 0;
      overflow: hidden;
    }
    #error-banner {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      background: #ef4444;
      color: white;
      font-size: 11px;
      padding: 8px;
      z-index: 9999;
      word-break: break-all;
    }
    #hud {
      width: 90%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-box {
      background: rgba(18, 24, 43, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      text-align: center;
    }
    .hud-val {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 900;
    }
    #next-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin: 2px auto 0 auto;
      background: #38bdf8;
      box-shadow: 0 0 10px currentColor;
    }
    #canvas-container {
      width: 90%;
      max-width: 360px;
      position: relative;
    }
    canvas {
      background: #0e1222;
      border-radius: 16px;
      border: 2px solid #1e293b;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 360 / 520;
      touch-action: none;
    }
    #bottom-bar {
      width: 90%;
      max-width: 360px;
      display: flex;
      gap: 10px;
    }
    .btn {
      border: none;
      outline: none;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      padding: 12px 0;
      font-size: 13px;
      transition: transform 0.08s;
    }
    .btn:active { transform: scale(0.95); }
    #btn-drop {
      flex: 2;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    #btn-quake {
      flex: 1;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }
    #btn-quake:disabled {
      opacity: 0.35;
      border-color: #475569;
      color: #64748b;
    }
    #gameover-screen {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 20, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      border-radius: 16px;
    }
    #gameover-screen h1 {
      font-size: 28px;
      color: #ef4444;
      margin-bottom: 8px;
    }
    #btn-restart {
      background: #38bdf8;
      color: #000;
      padding: 12px 28px;
      border-radius: 20px;
      border: none;
      font-weight: 800;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div id="error-banner"></div>

  <div id="hud">
    <div class="hud-box">SCORE<div class="hud-val" id="score-txt">0</div></div>
    <div class="hud-box">NEXT<div id="next-preview"></div></div>
    <div class="hud-box">BEST<div class="hud-val" id="best-txt">0</div></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="360" height="520"></canvas>
    <div id="gameover-screen">
      <h1>OVERFLOW!</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <button id="btn-restart">PLAY AGAIN</button>
    </div>
  </div>

  <div id="bottom-bar">
    <button class="btn" id="btn-drop">TAP TO DROP</button>
    <button class="btn" id="btn-quake" disabled>QUAKE (0%)</button>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const banner = document.getElementById('error-banner');
      if (banner) {
        banner.style.display = 'block';
        banner.innerText = 'JS Error line ' + line + ': ' + msg;
      }
    };

    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreTxt = document.getElementById('score-txt');
      const bestTxt = document.getElementById('best-txt');
      const nextPreview = document.getElementById('next-preview');
      const btnDrop = document.getElementById('btn-drop');
      const btnQuake = document.getElementById('btn-quake');
      const gameOverScreen = document.getElementById('gameover-screen');
      const finalScoreTxt = document.getElementById('final-score');
      const btnRestart = document.getElementById('btn-restart');

      let bestScore = 0;
      try {
        bestScore = parseInt(localStorage.getItem('neon_best') || '0');
      } catch(e) {}
      bestTxt.innerText = bestScore;

      const Sound = {
        ctx: null,
        init() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
          } catch(e) {}
        },
        tone(freq, dur = 0.15, vol = 0.2) {
          try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + dur);
          } catch(e) {}
        }
      };

      const TIERS = [
        { val: 2, r: 16, color: '#38bdf8' },
        { val: 4, r: 20, color: '#4ade80' },
        { val: 8, r: 25, color: '#fbbf24' },
        { val: 16, r: 30, color: '#fb7185' },
        { val: 32, r: 35, color: '#c084fc' },
        { val: 64, r: 41, color: '#f43f5e' },
        { val: 128, r: 47, color: '#06b6d4' },
        { val: 256, r: 53, color: '#e879f9' },
        { val: 512, r: 59, color: '#f97316' },
        { val: 1024, r: 65, color: '#3b82f6' }
      ];

      let score = 0;
      let combo = 1;
      let quakeCharge = 0;
      let screenShake = 0;
      let balls = [];
      let particles = [];
      let dropX = canvas.width / 2;
      let nextTier = 0;
      let isGameOver = false;
      let lastDropTime = 0; // Cooldown guard
      const CEILING_Y = 80;

      const BUMPERS = [
        { x: 80, y: 200, r: 10, lit: 0 },
        { x: 280, y: 200, r: 10, lit: 0 },
        { x: 180, y: 290, r: 12, lit: 0 }
      ];

      function pickNext() {
        return Math.floor(Math.random() * 3);
      }

      function updatePreview() {
        nextPreview.style.background = TIERS[nextTier].color;
      }

      nextTier = pickNext();
      updatePreview();

      class Ball {
        constructor(x, y, tier) {
          this.x = x;
          this.y = y;
          this.tier = tier;
          this.radius = TIERS[tier].r;
          this.color = TIERS[tier].color;
          this.val = TIERS[tier].val;
          this.vx = (Math.random() - 0.5) * 1.5;
          this.vy = 0;
        }
        update() {
          this.vy += 0.45;
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.985;

          if (this.y + this.radius > canvas.height) {
            this.y = canvas.height - this.radius;
            this.vy *= -0.3;
          }
          if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -0.6;
          } else if (this.x + this.radius > canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx *= -0.6;
          }

          BUMPERS.forEach(b => {
            const dx = this.x - b.x;
            const dy = this.y - b.y;
            const dist = Math.hypot(dx, dy);
            if (dist < this.radius + b.r) {
              const angle = Math.atan2(dy, dx);
              this.vx = Math.cos(angle) * 6;
              this.vy = Math.sin(angle) * 6;
              b.lit = 1.0;
              Sound.tone(540, 0.08, 0.15);
            }
          });
        }
        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#000';
          ctx.font = 'bold ' + (this.radius * 0.75) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.val, this.x, this.y);
          ctx.restore();
        }
      }

      function spawnSparks(x, y, color) {
        for (let i = 0; i < 15; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = Math.random() * 6 + 2;
          particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            alpha: 1.0,
            color
          });
        }
      }

      function handleCollisions() {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i];
            const b2 = balls[j];
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = b1.radius + b2.radius;

            if (dist < minDist) {
              if (b1.tier === b2.tier) {
                const nextT = Math.min(TIERS.length - 1, b1.tier + 1);
                const midX = (b1.x + b2.x) / 2;
                const midY = (b1.y + b2.y) / 2;
                spawnSparks(midX, midY, TIERS[nextT].color);
                balls.splice(j, 1);
                balls.splice(i, 1);
                balls.push(new Ball(midX, midY, nextT));

                score += TIERS[nextT].val * combo;
                scoreTxt.innerText = score;
                if (score > bestScore) {
                  bestScore = score;
                  bestTxt.innerText = bestScore;
                  try { localStorage.setItem('neon_best', bestScore); } catch(e) {}
                }

                quakeCharge = Math.min(100, quakeCharge + 10);
                btnQuake.innerText = `QUAKE (${quakeCharge}%)`;
                if (quakeCharge >= 100) btnQuake.disabled = false;

                screenShake = 6;
                Sound.tone(300 + nextT * 50, 0.2, 0.25);
                return;
              }

              const angle = Math.atan2(dy, dx);
              const overlap = minDist - dist;
              b1.x -= Math.cos(angle) * overlap * 0.5;
              b1.y -= Math.sin(angle) * overlap * 0.5;
              b2.x += Math.cos(angle) * overlap * 0.5;
              b2.y += Math.sin(angle) * overlap * 0.5;
            }
          }
        }
      }

      function setAimPosition(clientX) {
        const rect = canvas.getBoundingClientRect();
        if (!rect || rect.width === 0) return;
        const normalized = (clientX - rect.left) * (canvas.width / rect.width);
        if (!isNaN(normalized)) {
          dropX = Math.max(25, Math.min(canvas.width - 25, normalized));
        }
      }

      function dropCurrentBall() {
        if (isGameOver) return;
        
        // Strict Cooldown to prevent multi-drop glitches
        const now = Date.now();
        if (now - lastDropTime < 400) return;
        lastDropTime = now;

        if (balls.length < 35) {
          balls.push(new Ball(dropX, 40, nextTier));
          Sound.tone(280, 0.1, 0.2);
          nextTier = pickNext();
          updatePreview();
        }
      }

      // Touch & Pointer System (Single Unified Path)
      canvas.addEventListener('pointerdown', (e) => {
        setAimPosition(e.clientX);
      });

      canvas.addEventListener('pointermove', (e) => {
        setAimPosition(e.clientX);
      });

      canvas.addEventListener('pointerup', (e) => {
        setAimPosition(e.clientX);
        dropCurrentBall();
      });

      // Bottom Button
      btnDrop.addEventListener('click', () => {
        dropCurrentBall();
      });

      btnQuake.addEventListener('click', () => {
        if (quakeCharge < 100) return;
        quakeCharge = 0;
        btnQuake.disabled = true;
        btnQuake.innerText = `QUAKE (0%)`;
        screenShake = 18;
        Sound.tone(80, 0.3, 0.4);
        balls.forEach(b => {
          b.vy = -(Math.random() * 6 + 4);
          b.vx = (Math.random() - 0.5) * 10;
        });
      });

      btnRestart.addEventListener('click', () => {
        balls = [];
        particles = [];
        score = 0;
        quakeCharge = 0;
        scoreTxt.innerText = '0';
        btnQuake.innerText = 'QUAKE (0%)';
        btnQuake.disabled = true;
        isGameOver = false;
        gameOverScreen.style.display = 'none';
        spawnInitialBalls();
      });

      function spawnInitialBalls() {
        balls.push(new Ball(120, 460, 0));
        balls.push(new Ball(240, 460, 0));
        balls.push(new Ball(180, 390, 1));
      }
      spawnInitialBalls();

      function loop() {
        if (screenShake > 0) {
          ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
          screenShake *= 0.85;
          if (screenShake < 0.3) ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ceiling
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(0, CEILING_Y);
        ctx.lineTo(canvas.width, CEILING_Y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Aim Trajectory
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(dropX, 40);
        ctx.lineTo(dropX, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // Bumpers
        BUMPERS.forEach(b => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = b.lit > 0 ? '#38bdf8' : '#1e293b';
          ctx.fill();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();
          if (b.lit > 0) b.lit -= 0.05;
        });

        // Balls
        balls.forEach(b => {
          b.update();
          b.draw();
        });

        handleCollisions();

        // Particles
        particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.03;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 3, 3);
          ctx.restore();
          if (p.alpha <= 0) particles.splice(idx, 1);
        });

        requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
</html>
