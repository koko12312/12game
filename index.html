<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Fusion Drop</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; margin: 0; padding: 0; }
    body { background: #0b0d19; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    #ui { position: absolute; top: 15px; width: 90%; max-width: 400px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; pointer-events: none; }
    canvas { background: #121526; border-radius: 12px; box-shadow: 0 0 25px rgba(0, 255, 255, 0.15); border: 2px solid #222949; }
  </style>
</head>
<body>
  <div id="ui">
    <div>SCORE: <span id="score">0</span></div>
    <div>COMBO: <span id="combo">1x</span></div>
  </div>
  <canvas id="gameCanvas" width="360" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    const COLORS = ['#00ffff', '#39ff14', '#ff073a', '#ffea00', '#bf00ff', '#ff007f'];
    let score = 0, combo = 1, comboTimer = 0, shake = 0;
    let balls = [], particles = [];
    let dropX = canvas.width / 2;

    class Ball {
      constructor(x, y, tier) {
        this.x = x; this.y = y; this.tier = tier;
        this.radius = 16 + tier * 6;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 0;
        this.color = COLORS[tier % COLORS.length];
      }
      update() {
        this.vy += 0.45;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.98;

        if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.6; }
        if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -0.6; }
        if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -0.4; }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.font = 'bold ' + (12 + this.tier * 2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.pow(2, this.tier + 1), this.x, this.y);
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          alpha: 1,
          color
        });
      }
    }

    function checkCollisions() {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          let b1 = balls[i], b2 = balls[j];
          let dx = b2.x - b1.x, dy = b2.y - b1.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          let minDist = b1.radius + b2.radius;

          if (dist < minDist) {
            if (b1.tier === b2.tier) {
              spawnParticles((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, b1.color);
              balls.splice(j, 1);
              balls.splice(i, 1);
              balls.push(new Ball((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, b1.tier + 1));
              comboTimer = 90;
              combo++;
              score += Math.pow(2, b1.tier + 2) * combo;
              shake = 8;
              playBeep(260 + (b1.tier * 60) + (combo * 20));
              scoreEl.innerText = score;
              comboEl.innerText = combo + 'x';
              return;
            }
            let angle = Math.atan2(dy, dx);
            let overlap = minDist - dist;
            b1.x -= Math.cos(angle) * overlap * 0.5;
            b1.y -= Math.sin(angle) * overlap * 0.5;
            b2.x += Math.cos(angle) * overlap * 0.5;
            b2.y += Math.sin(angle) * overlap * 0.5;
          }
        }
      }
    }

    canvas.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      dropX = Math.max(25, Math.min(canvas.width - 25, e.clientX - rect.left));
    });

    canvas.addEventListener('pointerdown', () => {
      if (balls.length < 25) {
        balls.push(new Ball(dropX, 40, Math.floor(Math.random() * 2)));
        playBeep(200);
      }
    });

    function loop() {
      if (shake > 0) {
        ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.9;
        if (shake < 0.5) ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(dropX, 0); ctx.lineTo(dropX, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      balls.forEach(b => { b.update(); b.draw(); });
      checkCollisions();

      particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer === 0) { combo = 1; comboEl.innerText = '1x'; }
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
